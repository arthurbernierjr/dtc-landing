<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena · memory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <p><a class="back" href="../">Back to the sheet</a></p>
    <h1>Memory arena</h1>
    <p id="status" role="status">Match the pairs before the timer ends.</p>
    <div class="hud">
      <p class="hud__stat"><span>Score</span><strong id="score">0</strong></p>
      <p class="hud__stat"><span>Time</span><strong id="timer">45</strong></p>
      <button id="start" type="button">Start</button>
    </div>
    <div id="board" class="board" aria-label="Card board"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
